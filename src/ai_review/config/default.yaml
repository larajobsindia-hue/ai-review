llm:
  provider: llamacpp
  endpoint: http://127.0.0.1:8080
  model: auto
  timeout_seconds: 120
  max_tokens: 4096
  json_mode: auto
security:
  redact_secrets: true
  excluded_files:
    - .env
    - "*.pem"
    - "*.key"
    - "*.p12"
resolution:
  enabled: true
  severity: HIGH
  allowlist: []
policy:
  block_on: [CRITICAL, HIGH]
  minimum_confidence_to_block: 0.80
failure_policy:
  on_llm_unavailable: warn
checks:
  enabled: true
  auto_detect: true
  trusted_commands: []
  commands: []
context:
  enabled: true
  lines_before: 30
  lines_after: 30
  max_file_size_kb: 500
  max_total_context_kb: 1000
review:
  max_diff_kb: 200
  chunking:
    enabled: true
    max_chunk_kb: 50
cache:
  enabled: false
generated:
  policy: ignore
  ignore:
    - dist/
    - build/
    - coverage/
    - node_modules/
    - vendor/
  security_only: []
static_analysis:
  enabled: true
  fail_on_error: false
  timeout: 120
  concurrency: 4
  max_findings: 200
  tools:
    # Phase 1 (deterministic evidence for the AI reviewer)
    semgrep: { enabled: true }
    phpstan: { enabled: true }
    eslint: { enabled: true }
    ruff: { enabled: true }
    staticcheck: { enabled: true }
    # Phase 2
    larastan: { enabled: true }
    typescript: { enabled: true }
    govet: { enabled: true }
    sqlfluff: { enabled: true }
    hadolint: { enabled: true }
    trivy: { enabled: false }    # IaC scan: never downloads its DB in a pre-commit
    # Phase 3 (explicit opt-in only)
    codeql: { enabled: false }
    sonarqube: { enabled: false }
    checkov: { enabled: true }
    tflint: { enabled: true }
    kubeconform: { enabled: true }
    kube_linter: { enabled: true }
organization:
  enforce: false
  redact_secrets: null
