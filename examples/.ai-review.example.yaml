# ai-review example configuration
#
# Copy this file to the repository root as `.ai-review.yaml` and customize.
# User-level settings live in ~/.config/ai-review/config.yaml instead.
#
# Layer precedence (highest wins):
#   CLI args > repo .ai-review.yaml > user config.yaml > org config
# For an organization-wide baseline, point AI_REVIEW_ORG_CONFIG at a shared
# YAML file, e.g.:  export AI_REVIEW_ORG_CONFIG=/etc/ai-review/org.yaml

# LLM backend used for the review pass.
llm:
  provider: llamacpp          # llamacpp | openai_compatible
  endpoint: http://127.0.0.1:8080
  model: auto
  timeout_seconds: 120
  max_tokens: 4096

# Secret redaction and file exclusions applied before anything reaches the LLM.
# NOTE: repo-level excluded_files REPLACE the default list wholesale
# (defaults: [".env", "*.pem", "*.key", "*.p12"]) — re-list everything you need.
security:
  redact_secrets: true
  excluded_files: [".env", "*.pem", "*.key", "*.p12"]

# Deterministic unresolved-reference gate: a symbol added to a file without
# the import that binds it (``User::all()`` with no ``use App\Models\User;``)
# blocks the commit in any language, without calling the LLM. Only symbols
# defined somewhere in the repository are judged, so framework global aliases
# are never mistaken for missing imports.
resolution:
  enabled: true
  severity: HIGH              # CRITICAL | HIGH | MEDIUM | LOW | INFO
  allowlist: []               # project globals the gate must never question

# Which findings block the commit. NOTE: the resolution gate is hard-blocking
# and is not subject to these thresholds.
policy:
  block_on: [CRITICAL, HIGH]
  minimum_confidence_to_block: 0.80

# What to do when the LLM cannot be reached: block | warn | allow
failure_policy:
  on_llm_unavailable: warn

# Deterministic checks (Phase 3). Repo-side `commands` only run if allowlisted
# by the org's `trusted_commands`; both are lists of command mappings.
checks:
  enabled: true
  auto_detect: true
  trusted_commands: []
  commands: []

# Surrounding lines attached to each diff hunk for the LLM prompt.
# (Phase 2: the context engine — honored by config schema today, wiring lands later.)
context:
  enabled: true
  lines_before: 30
  lines_after: 30

# Deterministic static analysis: external tools whose findings are handed to the
# AI as EVIDENCE (they never block a commit on their own — the policy engine and
# the offline security/resolution gates decide blocking).
static_analysis:
  enabled: true
  fail_on_error: false        # true: a failed tool becomes a CLI error (exit 2)
  timeout: 120                # per-tool seconds
  concurrency: 4              # bounded parallel tool execution
  max_findings: 200           # per-tool cap before dedup
  tools:                      # opt-in: a tool runs only when enabled here
    semgrep: { enabled: true }  # needs a repo semgrep config; never --config auto
    phpstan: { enabled: true }
    eslint: { enabled: true }
    ruff: { enabled: true }
    staticcheck: { enabled: true }
    larastan: { enabled: true }     # Laravel only
    typescript: { enabled: true }
    govet: { enabled: true }
    sqlfluff: { enabled: true }
    hadolint: { enabled: true }
    trivy: { enabled: false }       # never downloads a DB in pre-commit
    codeql: { enabled: false }      # CI-only
    sonarqube: { enabled: false }   # CI-only, requires a server
    checkov: { enabled: true }
    tflint: { enabled: true }
    kubeconform: { enabled: true }
    kube_linter: { enabled: true }
